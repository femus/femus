<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>femus radio chat</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #0d1117; color: #e6edf3;
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid #21262d; display: flex; align-items: baseline; gap: 12px; }
  header b { font-size: 18px; letter-spacing: .02em; }
  header span { color: #8b949e; font-size: 13px; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; align-self: center; box-shadow: 0 0 8px #3fb950; }
  main { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 70%; padding: 10px 14px; border-radius: 16px; word-break: break-word; animation: pop .18s ease-out; }
  .msg small { display: block; font-size: 11px; opacity: .55; margin-top: 4px; }
  .them { align-self: flex-start; background: #21262d; border-bottom-left-radius: 4px; }
  .me { align-self: flex-end; background: #1f6feb; border-bottom-right-radius: 4px; }
  form { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid #21262d; }
  input { flex: 1; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid #30363d; background: #161b22; color: inherit; outline: none; }
  input:focus { border-color: #1f6feb; }
  button { font: inherit; padding: 12px 18px; border-radius: 12px; border: 0; background: #1f6feb; color: #fff; cursor: pointer; }
  #left { align-self: center; color: #8b949e; font-size: 12px; min-width: 3ch; text-align: right; }
  @keyframes pop { from { transform: translateY(6px); opacity: 0; } }
</style>
</head>
<body>
<header><span class="dot"></span><b>femus radio chat</b><span>{{me}} ⇄ {{peer}} · 433 MHz · no Wi‑Fi, no cellular</span></header>
<main id="log"></main>
<form id="f"><input id="t" autocomplete="off" autofocus placeholder="Message to {{peer}}…" maxlength="50"><span id="left">50</span><button>Send</button></form>
<script>
  const log = document.getElementById('log'), input = document.getElementById('t'), left = document.getElementById('left');
  const bytes = s => new TextEncoder().encode(s).length;
  let since = 0;
  async function poll() {
    try {
      const r = await fetch('/messages?since=' + since);
      for (const m of await r.json()) {
        since = m.id;
        const el = document.createElement('div');
        el.className = 'msg ' + (m.from === 'me' ? 'me' : 'them');
        el.textContent = m.text;
        const meta = document.createElement('small');
        meta.textContent = (m.from === 'me' ? '' : m.from + ' · ') + m.at;
        el.appendChild(meta);
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
      }
    } catch (e) {}
    setTimeout(poll, 500);
  }
  poll();
  input.addEventListener('input', () => { while (bytes(input.value) > 50) input.value = input.value.slice(0, -1); left.textContent = 50 - bytes(input.value); });
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = ''; left.textContent = '50';
    await fetch('/send', { method: 'POST', body: text });
  });
</script>
</body>
</html>
