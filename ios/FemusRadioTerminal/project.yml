name: FemusRadioTerminal
options:
  bundleIdPrefix: com.femus
  deploymentTarget:
    iOS: "16.0"
targets:
  FemusRadioTerminal:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Femus Radio
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: Connects to the femus radio node over Bluetooth
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.femus.FemusRadioTerminal
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
